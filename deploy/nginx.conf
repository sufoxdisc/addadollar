# addadollar.com - nginx configuration (alternative to Caddy)
#
# Used by deploy.sh --proxy nginx AFTER the Let's Encrypt certificate has been issued
# with certbot (the script handles that order). Edit the domain/port if you use it by hand.
#
#   http  (80)  : ACME challenges, everything else -> 301 to https://addadollar.com
#   https (443) : www -> 301 to the apex, apex -> Node app on 127.0.0.1:3000

server {
    listen 80;
    listen [::]:80;
    server_name addadollar.com www.addadollar.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://addadollar.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.addadollar.com;

    ssl_certificate     /etc/letsencrypt/live/addadollar.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/addadollar.com/privkey.pem;

    return 301 https://addadollar.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name addadollar.com;

    ssl_certificate     /etc/letsencrypt/live/addadollar.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/addadollar.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    client_max_body_size 100k;   # the app caps requests at 50kb; Stripe webhooks are small too

    # The app also sends HSTS. It is set here too in case a response comes from nginx itself.
    # No includeSubDomains on purpose: it would also force HTTPS on your mail subdomains.
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
